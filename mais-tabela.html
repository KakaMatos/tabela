<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>
    
    
    <h1>Mais sobre tabelas</h1>
    
    <table border="1">
        <caption>Listagem de produtos</caption>
        <thead>
            <tr>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Preço</th>
            </tr>
        </thead>

        <body>
            <tr>
            <td>Notebook</td>
            <td>1</td>
            <td>R$ 2000</td>
        </tr>
        <tr>
            <td>Tablet</td>
            <td>2</td>
            <td>R$ 1000</td>
        </tr>
        </body>

        <tfoot>
            <tr>
                <td>total</td>
                <td colspan="2">R$ 4000</td>
            </tr>
        </tfoot>
        
    </table>

</body>
</html>
